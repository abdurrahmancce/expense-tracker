const statusEl = document.getElementById("status");
const btn = document.getElementById("restoreBtn");

btn.addEventListener("click", async () => {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  if (!email || !password) {
    statusEl.textContent = "Email o password din।";
    statusEl.style.color = "red";
    return;
  }

  btn.disabled = true;
  statusEl.style.color = "black";
  statusEl.textContent = "Logging in...";

  try {
    const cred = await auth.signInWithEmailAndPassword(email, password);
    const uid = cred.user.uid;

    statusEl.textContent = "Fetching current data...";
    const docRef = db.collection("users").doc(uid);
    const docSnap = await docRef.get();

    let currentExpenses = [];
    let currentSalamis = [];
    let currentDarkMode = false;

    if (docSnap.exists) {
      const data = docSnap.data();
      currentExpenses = data.expenses || [];
      currentSalamis = data.salamis || [];
      currentDarkMode = data.darkMode || false;
    }

    statusEl.textContent = "Merging and saving...";

    const mergedExpenses = [...recoveredExpenses, ...currentExpenses];
    const mergedSalamis = [...recoveredSalamis, ...currentSalamis];

    await docRef.set({
      expenses: mergedExpenses,
      salamis: mergedSalamis,
      darkMode: currentDarkMode
    });

    statusEl.style.color = "green";
    statusEl.textContent =
      "✅ Success! Total expenses now: " + mergedExpenses.length +
      "\nTotal bonus entries now: " + mergedSalamis.length +
      "\n\nAapni ekhon main app-e giye refresh korle shob data dekhte pabben.";
  } catch (err) {
    statusEl.style.color = "red";
    statusEl.textContent = "Error: " + err.message;
  } finally {
    btn.disabled = false;
  }
});
